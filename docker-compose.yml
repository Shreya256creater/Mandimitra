services:
  postgres:
    image: postgres:16-alpine
    container_name: mandimitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandimitra
      POSTGRES_PASSWORD: mandimitra
      POSTGRES_DB: mandimitra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandimitra -d mandimitra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
